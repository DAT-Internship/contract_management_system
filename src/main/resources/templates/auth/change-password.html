<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Change Password')}"></head>
<body>
	<!-- Sidebar -->
	<aside th:replace="~{fragments/layout :: sidebar}"></aside>
	
	<!-- Topbar -->
	<div style="margin-left: 292px; width: calc(100% - 292px); position: fixed; top: 0; z-index: 1000;">
		<header th:replace="~{fragments/layout :: topbar}"></header>
	</div>

	<!-- Main Content -->
	<div class="main-wrapper" style="margin-left: 292px; width: calc(100% - 292px); padding: 30px; margin-top: 80px;">
		<main class="content">
			<div style="margin-left: 40px;" class="w-50">
				<div th:replace="~{fragments/layout :: alerts}"></div>
			</div>
			
			<div class="card shadow-sm w-50" style="margin-left: 40px;">
				<div class="card-header bg-white">
					<h4 class="mb-0">Change Password</h4>
				</div>
				<div class="card-body">
					<form th:action="@{/change-password}" method="post">
						<div class="mb-3">
							<label class="form-label">Current Password</label>
							<input type="password" name="currentPassword" class="form-control" required>
						</div>
						
						<div class="mb-3">
							<label class="form-label">New Password</label>
							<input type="password" name="newPassword" class="form-control" required minlength="6">
						</div>

						<div class="mb-3">
							<label class="form-label">Confirm New Password</label>
							<input type="password" name="confirmPassword" class="form-control" required minlength="6">
						</div>

						<div class="d-flex justify-content-between">
							<a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
							<button type="submit" class="btn btn-primary">Update Password</button>
						</div>
					</form>
				</div>
			</div>
		</main>
	</div>

	<!-- Scripts -->
	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
