<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Contract Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.3.1/css/all.css" />
    
    <style>
        body {
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-wrap: wrap;
        }

        /* ဘယ်ဘက် Brand Side */
        .brand-side {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 40px;
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .brand-side img {
            max-width: 180px;
            margin-bottom: 20px;
            background: white;
            padding: 10px;
            border-radius: 10px;
        }

        .brand-side h3 {
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .brand-side p {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* ညာဘက် Form Side */
        .form-side {
            padding: 50px 40px;
            flex: 1;
            min-width: 300px;
        }

        .form-side h4 {
            color: #1e3c72;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #ced4da;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(30, 60, 114, 0.25);
            border-color: #1e3c72;
        }

        .btn-primary {
            background-color: #1e3c72;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: #2a5298;
            transform: translateY(-2px);
        }

        .input-group-text {
            background-color: #f8f9fa;
            border-right: none;
            border-radius: 8px 0 0 8px;
        }
        
        
        /* Modern Toast Notification */
.toast-container-custom {
    position: fixed;
    top: 25px;
    right: 25px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.custom-toast {
    min-width: 320px;
    max-width: 420px;
    background: #ffffff;
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 13px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.13);
    border-left: 4px solid #16a34a;
    animation: toastSlideIn 0.4s ease forwards;
}

.custom-toast.error {
    border-left-color: #dc3545;
}

.toast-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #dcfce7;
    color: #16a34a;
    font-size: 18px;
    flex-shrink: 0;
}

.custom-toast.error .toast-icon {
    background: #fee2e2;
    color: #dc3545;
}

.toast-content {
    flex: 1;
}

.toast-title {
    font-size: 14px;
    font-weight: 700;
    color: #212529;
    margin-bottom: 3px;
}

.toast-message {
    font-size: 13px;
    color: #6c757d;
    margin: 0;
}

.toast-close {
    border: none;
    background: transparent;
    color: #9ca3af;
    font-size: 16px;
    cursor: pointer;
}

.toast-close:hover {
    color: #212529;
}

.custom-toast.hide {
    animation: toastSlideOut 0.35s ease forwards;
}

@keyframes toastSlideIn {
    from {
        opacity: 0;
        transform: translateX(30px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes toastSlideOut {
    to {
        opacity: 0;
        transform: translateX(30px);
    }
}

@media (max-width: 480px) {
    .toast-container-custom {
        left: 15px;
        right: 15px;
        top: 15px;
    }

    .custom-toast {
        min-width: 0;
        width: 100%;
    }
}
    </style>
</head>
<body>

<div class="login-container m-3">
    <!-- ဘယ်ဘက် Logo နဲ့ အချက်အလက် -->
    <div class="brand-side">
        <img th:src="@{/images/dat-logo.png}" alt="DAT Logo">
        <h3>Contract Management</h3>
        <p>Enterprise CMS Solution</p>
    </div>

    <!-- ညာဘက် Login Form -->
    <div class="form-side">
        <h4>Welcome Back</h4>
        <p class="text-muted mb-4" style="font-size: 0.9rem;">Please sign in to continue.</p>

        <!-- Error Message -->
        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <div>Invalid Staff ID or Password.</div>
        </div>
        
        <!-- Logout Message -->
        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <div>You have been logged out successfully.</div>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Staff ID</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="e.g., 25-00001" required autofocus>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>

            <!-- 🔴 ဒီနေရာမှာ Forgot Password လင့်ခ် ထည့်ထားပါတယ် -->
            <div class="d-flex justify-content-end mb-3">
                <a href="#" class="text-decoration-none" style="color: #1e3c72; font-size: 0.9rem;" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
                    Forgot Password?
                </a>
            </div>
            
            <button class="btn btn-primary w-100" type="submit">
                Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
            </button>
        </form>
    </div>
</div>

<!-- 🔴 Forgot Password အတွက် Modal (Popup) -->
<!-- Forgot Password Modal -->

<div class="modal fade"
     id="forgotPasswordModal"
     tabindex="-1"
     aria-labelledby="forgotPasswordModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header bg-light">

                <h5 class="modal-title" id="forgotPasswordModalLabel">
                    <i class="fa-solid fa-key me-2"></i>
                    Password Reset Request
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>

            </div>

            <div class="modal-body">

                <div class="alert alert-info py-2">
                    Please enter your Staff ID and select a reason.
                </div>

                <form th:action="@{/forgot-password}"
                      method="post">

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Staff ID
                        </label>

                        <input type="text"
                               name="employeeCode"
                               class="form-control"
                               placeholder="e.g., 25-00001"
                               maxlength="20"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Reason for Reset
                        </label>

                        <select name="reason"
                                class="form-select"
                                required>

                            <option value="" selected disabled>
                                -- Select a reason --
                            </option>

                            <option value="forgot">
                                I forgot my password
                            </option>

                            <option value="compromised">
                                My account was compromised
                            </option>

                            <option value="expired">
                                My password expired
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Additional Details (Optional)
                        </label>

                        <textarea name="additionalDetails"
                                  class="form-control"
                                  rows="3"
                                  maxlength="2000"
                                  placeholder="Type additional information here..."></textarea>

                    </div>

                    <div class="d-flex justify-content-end gap-2">

                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button type="submit"
                                class="btn btn-primary">
                            Submit Request
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- Toast Notifications -->
<div class="toast-container-custom">

    <!-- Success Toast -->
    <div th:if="${success}"
         class="custom-toast"
         id="successToast">

        <div class="toast-icon">
            <i class="fa-solid fa-check"></i>
        </div>

        <div class="toast-content">
            <div class="toast-title">Request Submitted</div>
            <p class="toast-message" th:text="${success}"></p>
        </div>

        <button type="button"
                class="toast-close"
                onclick="closeToast('successToast')">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- Error Toast -->
    <div th:if="${error}"
         class="custom-toast error"
         id="errorToast">

        <div class="toast-icon">
            <i class="fa-solid fa-circle-exclamation"></i>
        </div>

        <div class="toast-content">
            <div class="toast-title">Request Failed</div>
            <p class="toast-message" th:text="${error}"></p>
        </div>

        <button type="button"
                class="toast-close"
                onclick="closeToast('errorToast')">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

</div>


<!-- Bootstrap JS ကို ခေါ်ဖို့ လိုပါတယ် (Modal အလုပ်လုပ်ဖို့) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


<script>
    function closeToast(id) {
        const toast = document.getElementById(id);

        if (toast) {
            toast.classList.add('hide');

            setTimeout(() => {
                toast.remove();
            }, 350);
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        const toasts = document.querySelectorAll('.custom-toast');

        toasts.forEach(function (toast) {
            setTimeout(function () {
                closeToast(toast.id);
            }, 4000);
        });
    });
</script>
</body>
</html>
