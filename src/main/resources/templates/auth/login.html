<body>

<div class="login-container m-3">
    <!-- ဘယ်ဘက် Logo နဲ့ အချက်အလက် -->
    <div class="brand-side">
        <img th:src="@{/images/dat-logo.png}" alt="DAT Logo">
        <h3>Contract Management</h3>
        <p>Enterprise CMS Solution</p>
    </div>

    <!-- ညာဘက် Login Form -->
    <div class="form-side">
        <h4>Welcome Back</h4>
        <p class="text-muted mb-4" style="font-size: 0.9rem;">Please sign in to continue.</p>
        <!-- Error Message -->
        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
           <!--  <div>Login unsuccessful. Please check your Staff ID and password.</div>-->
        </div>
        
        <!-- Logout Message -->
        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <div>You have been logged out successfully.</div>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Staff ID</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="e.g., 25-00001" required autofocus>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>

            <!-- 🔴 ဒီနေရာမှာ Forgot Password လင့်ခ် ထည့်ထားပါတယ် -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember Me</label>
                </div>
                <a href="#" class="text-decoration-none" style="color: #1e3c72; font-size: 0.9rem;" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
                    Forgot Password?
                </a>
            </div>
            
            <button class="btn btn-primary w-100" type="submit">
                Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
            </button>
        </form>
    </div>
</div>

<!-- 🔴 Forgot Password အတွက် Modal (Popup) -->
<div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title" id="forgotPasswordModalLabel"><i class="fa-solid fa-key me-2"></i>Password Reset Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info py-2" style="font-size: 0.9rem;">
                    Please enter your Staff ID and select a reason. An administrator will review your request.
                </div>
                
                <!-- UI သက်သက်သာ ဖြစ်လို့ Action မပါဘူး -->
                <form>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Staff ID</label>
                        <input type="text" class="form-control" placeholder="e.g., 25-00001" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Reason for Reset</label>
                        <select class="form-select" required>
                            <option value="" selected disabled>-- Select a reason --</option>
                            <option value="forgot">I forgot my password</option>
                            <option value="compromised">My account was compromised</option>
                            <option value="expired">My password expired</option>
                            <option value="other">Other (Please specify below)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Additional Details (Optional)</label>
                        <textarea class="form-control" rows="3" placeholder="Type any additional information here..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="alert('This is UI only. Backend integration is required to send the request.')">
                    Submit Request
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS ကို ခေါ်ဖို့ လိုပါတယ် (Modal အလုပ်လုပ်ဖို့) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
