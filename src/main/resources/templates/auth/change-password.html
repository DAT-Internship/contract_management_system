<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Change Password')}"></head>
<link rel="stylesheet" th:href="@{/css/change-password.css}">
<body>
	<th:block th:with="page='change-password'">
	
	<!-- Side-bar -->
	<aside th:replace="~{fragments/layout :: sidebar}"></aside>
	
	<!-- Top-bar -->
	<div class="change-password-topbar">
	    <header th:replace="~{fragments/layout :: topbar}"></header>
	</div>

	<!-- Main Content -->
	<div class="main-wrapper change-password-wrapper">
		<main class="content change-password-content">
		    <div class="change-password-container">
		
		        <!-- Alerts -->
		        <div class="change-password-alerts">
		            <div th:replace="~{fragments/layout :: alerts}"></div>
		        </div>
		
		        <!-- Password card -->
		        <section class="password-card">
		
		            <!-- Card header -->
		            <div class="password-card-header">		
		                <div class="password-header-icon">
		                    <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
		                </div>
		
		                <div class="password-header-text">
		                    <span class="password-eyebrow">Account Security</span>		
		                    <h1>Change Password</h1>		
		                    <p>Create a new password to keep your account secure.</p>
		                </div>	
		            </div>
		
		            <!-- Form -->
		            <form th:action="@{/change-password}" method="post" class="password-form">
		
		                <!-- Current password -->
		                <div class="password-field">		
		                    <label for="currentPassword" class="form-label">Current Password <span class="password-required">*</span></label>
		                    <div class="password-input-wrapper">		
		                        <i class="fa-solid fa-lock password-input-icon" aria-hidden="true"></i>		
		                        <input id="currentPassword" type="password" name="currentPassword" class="form-control password-input" placeholder="Enter your current password" autocomplete="current-password" required>		
		                        <button type="button" class="password-toggle" data-password-target="currentPassword" aria-label="Show current password" title="Show password"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>		
		                    </div>
		                </div>
		
		                <div class="password-form-divider"></div>
		
		                <!-- New password -->
		                <div class="password-field">		
		                    <label for="newPassword" class="form-label">New Password <span class="password-required">*</span></label>		
		                    <div class="password-input-wrapper">		
		                        <i class="fa-solid fa-key password-input-icon" aria-hidden="true"></i>		
		                        <input id="newPassword" type="password" name="newPassword" class="form-control password-input" placeholder="Enter your new password" autocomplete="new-password" minlength="6" required>		
		                        <button type="button" class="password-toggle" data-password-target="newPassword" aria-label="Show new password" title="Show password">		<i class="fa-regular fa-eye" aria-hidden="true"></i></button>		
		                    </div>		
		                    <small class="password-help-text">Your password must contain at least 6 characters.</small>
		                </div>
		
		                <!-- Confirm password -->
		                <div class="password-field">		
		                    <label for="confirmPassword" class="form-label">Confirm New Password <span class="password-required">*</span></label>		
		                    <div class="password-input-wrapper">		
		                        <i class="fa-solid fa-check password-input-icon" aria-hidden="true"></i>		
		                        <input id="confirmPassword" type="password" name="confirmPassword" class="form-control password-input" placeholder="Enter the new password again" autocomplete="new-password" minlength="6" required>		
		                        <button type="button" class="password-toggle" data-password-target="confirmPassword" aria-label="Show confirmed password" title="Show password"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>		
		                    </div>		
		                    <small id="passwordMatchMessage" class="password-match-message" aria-live="polite"></small>
		                </div>
		
		                <!-- Security note -->
		                <div class="password-security-note">		
		                    <i class="fa-solid fa-circle-info" aria-hidden="true"></i>		
		                    <p>After updating your password, use the new password the next time you sign in.</p>		
		                </div>
		
		                <!-- Actions -->
		                <div class="password-form-actions">		
		                    <a th:href="@{/dashboard}" class="password-cancel-button">Cancel</a>		
		                    <button type="submit" class="password-submit-button"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i>Update Password</button>		
		                </div>		
		            </form>		
		        </section>		
		    </div>		
		</main>
	</div>

	<script>
	    document.querySelectorAll(".password-toggle").forEach((button) => {
	        button.addEventListener("click", () => {
	            const inputId = button.dataset.passwordTarget;
	            const input = document.getElementById(inputId);
	            const icon = button.querySelector("i");
	
	            if (!input || !icon) {
	                return;
	            }
	
	            const isHidden = input.type === "password";	
	            input.type = isHidden ? "text" : "password";	
	            icon.classList.toggle("fa-eye", !isHidden);
	            icon.classList.toggle("fa-eye-slash", isHidden);	
	            button.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");	
	            button.setAttribute("title", isHidden ? "Hide password" : "Show password");
	        });
	    });
	
	    const newPassword = document.getElementById("newPassword");
	    const confirmPassword = document.getElementById("confirmPassword");
	    const matchMessage = document.getElementById("passwordMatchMessage");
	
	    function checkPasswordMatch() {
	        if (!confirmPassword.value) {
	            matchMessage.textContent = "";
	            matchMessage.className = "password-match-message";
	            confirmPassword.setCustomValidity("");
	            return;
	        }
	
	        if (newPassword.value === confirmPassword.value) {
	            matchMessage.textContent = "Passwords match.";
	            matchMessage.className = "password-match-message is-match";
	
	            confirmPassword.setCustomValidity("");
	        } else {
	            matchMessage.textContent = "Passwords do not match.";
	            matchMessage.className = "password-match-message is-error";
	
	            confirmPassword.setCustomValidity("Passwords do not match.");
	        }
	    }
	
	    newPassword.addEventListener("input", checkPasswordMatch);
	    confirmPassword.addEventListener("input", checkPasswordMatch);
	</script>
	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
	</th:block>
</body>
</html>
