<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Password Requests')}"></head>
<body>
	<!-- Sidebar -->
	<aside th:replace="~{fragments/layout :: sidebar}"></aside>
	
	<!-- Topbar -->
	<div style="margin-left: 280px; width: calc(100% - 280px); position: fixed; top: 0; z-index: 1000;">
		<header th:replace="~{fragments/layout :: topbar}"></header>
	</div>

	<!-- Main Content -->
	<div class="main-wrapper" style="margin-left: 270px; width: calc(100% - 270px); padding: 20px; margin-top: 80px;">
		
		<main class="content">
			<!-- Alerts (Success/Error) -->
			<div th:replace="~{fragments/layout :: alerts}"></div>
			
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h2>Password Reset Requests</h2>
			</div>

			<div class="card shadow-sm">
				<div class="card-body">
					<table class="table table-hover">
						<thead class="table-light">
							<tr>
								<th>Staff ID</th>
								<th>Reason</th>
								<th>Details</th>
								<th>Requested At</th>
								<th>Actions</th>
							</tr>
						</thead>
						<tbody>
							<!-- Request မရှိရင် ပြမယ့် စာသား -->
							<tr th:if="${#lists.isEmpty(requests)}">
								<td colspan="5" class="text-center text-muted py-4">
									<i class="fa-solid fa-check-circle text-success me-2"></i> No pending requests at the moment.
								</td>
							</tr>

							<!-- Request တွေ ရှိရင် Loop ပတ်ပြမယ် -->
							<tr th:each="req : ${requests}">
								<td th:text="${req.employeeCode}"></td>
								<td><span class="badge bg-warning text-dark" th:text="${req.reason}"></span></td>
								<td th:text="${req.details}"></td>
								<td th:text="${#temporals.format(req.requestedAt, 'yyyy-MM-dd HH:mm')}"></td>
								<td>
									<!-- Reset ခလုတ် (Form နဲ့ ပို့မယ်) -->
									<form th:action="@{/admin/password-resets/reset/{id}(id=${req.requestId})}" method="post" class="d-inline">
										<button type="submit" class="btn btn-sm btn-primary" onclick="return confirm('Are you sure you want to reset this user\'s password to default?');">
											<i class="fa-solid fa-rotate-left me-1"></i> Reset Password
										</button>
									</form>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</main>
	</div>

	<!-- Scripts -->
	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
