
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login - Contract Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://use.fontawesome.com/releases/v7.3.1/css/all.css">

    <style>
        /* ===================== BODY ===================== */

        body {
            min-height: 100vh;
            height: auto;
            padding: 24px 12px;

            background:
                linear-gradient(
                    rgba(14, 30, 55, 0.12),
                    rgba(14, 30, 55, 0.12)
                ),
                url('/images/office.png');

            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ===================== LOGIN CONTAINER ===================== */

        .login-container {
            width: min(600px, calc(100vw - 32px));
            max-width: 600px;
            min-height: 0;
            height: auto;

            display: flex;
            flex-wrap: nowrap;

            border: 1px solid rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            overflow: hidden;

            background: #f8fbff;

            box-shadow: 0 20px 54px rgba(10, 42, 82, 0.30);

            backdrop-filter: blur(5px);
        }

        /* ===================== BRAND SIDE ===================== */

        .brand-side {
            flex: 0 0 42%;
            min-width: 0;

            padding: 20px 14px;

            color: #fff;

            background:
                radial-gradient(
                    circle at 100% 0%,
                    rgba(22, 155, 243, 0.88),
                    transparent 48%
                ),
                linear-gradient(
                    145deg,
                    #07336e 0%,
                    #0757a3 58%,
                    #078bd7 100%
                );

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .brand-side img {
            max-width: 125px;
            margin-bottom: 10px;
            padding: 8px;

            border-radius: 13px;
            background: #fff;

            box-shadow: 0 10px 25px rgba(0, 18, 49, 0.2);
        }

        .brand-side h3 {
            margin-bottom: 7px;
            font-size: 1.18rem;
            font-weight: 700;
        }

        .brand-side p {
            color: rgba(245, 250, 255, 0.9);
            font-size: 0.98rem;
            margin-bottom: 0;
        }

        /* ===================== FORM SIDE ===================== */

        .form-side {
            flex: 1 1 58%;
            min-width: 0;

            padding: 20px;

            color: #14345c;
            background: #fafcff;
        }

        .form-side h4 {
            margin-bottom: 4px;
            color: #103568;
            font-size: 1.25rem;
            font-weight: 750;
        }

        .form-side > p {
            margin-bottom: 9px !important;
            color: #66758a !important;
            font-size: 0.9rem;
        }

        .form-side .form-label {
            margin-bottom: 5px;
            color: #24456f;
            font-size: 0.86rem;
        }

        .form-side .mb-3 {
            margin-bottom: 0.55rem !important;
        }

        .form-side .input-group-text {
            padding: 7px 10px;
            color: #12518e;
            background: #edf4fc;
            border-color: #d3deec;
        }

        .login-container .form-control {
            min-height: 37px;
            padding: 6px 9px;

            color: #24364d;
            background: #fff;

            border-color: #d3deec;
            font-size: 0.92rem;
        }

        .login-container .form-control:focus {
            border-color: #1683d0;
            box-shadow: 0 0 0 0.2rem rgba(22, 131, 208, 0.14);
        }

        .form-side .alert {
            padding: 9px 11px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-size: 0.88rem;
        }

        .form-side a {
            color: #0877c9 !important;
            font-size: 0.86rem !important;
            font-weight: 600;
        }

        .form-side .btn-primary {
            min-height: 39px;
            padding: 7px 10px;

            color: #fff;

            background: linear-gradient(100deg, #074b91, #0788d6);
            border: 0;
            border-radius: 11px;

            font-size: 0.98rem;
            font-weight: 600;

            box-shadow: 0 7px 16px rgba(5, 91, 163, 0.2);
            transition: all 0.3s;
        }

        .form-side .btn-primary:hover {
            color: #fff;
            background: linear-gradient(100deg, #063e7b, #0678bf);
            transform: translateY(-1px);
        }

        .form-side .form-check-label {
            color: #59677c;
            font-size: 0.9rem;
        }

        /* ===================== TOAST NOTIFICATION ===================== */

        .toast-container-custom {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 9999;

            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .custom-toast {
            min-width: 320px;
            max-width: 420px;

            background: #fff;
            border-radius: 12px;
            padding: 16px 18px;

            display: flex;
            align-items: center;
            gap: 13px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.13);
            border-left: 4px solid #16a34a;

            animation: toastSlideIn 0.4s ease forwards;
        }

        .custom-toast.error {
            background: #fff5f5;
            border: 1px solid #fecaca;
            border-left: 5px solid #dc2626;
            color: #991b1b;

            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.15);
        }

        .toast-icon {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #dcfce7;
            color: #16a34a;

            font-size: 18px;
            flex-shrink: 0;
        }

        .custom-toast.error .toast-icon {
            background: #fee2e2;
            color: #dc2626;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-size: 14px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 3px;
        }

        .custom-toast.error .toast-title {
            color: #b91c1c;
        }

        .toast-message {
            font-size: 13px;
            color: #6c757d;
            margin: 0;
            overflow-wrap: anywhere;
        }

        .custom-toast.error .toast-message {
            color: #7f1d1d;
        }

        .toast-close {
            border: none;
            background: transparent;
            color: #9ca3af;
            font-size: 16px;
            cursor: pointer;
        }

        .toast-close:hover {
            color: #212529;
        }

        .custom-toast.hide {
            animation: toastSlideOut 0.35s ease forwards;
        }

        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toastSlideOut {
            to {
                opacity: 0;
                transform: translateX(30px);
            }
        }

        /* ===================== RESPONSIVE ===================== */

        @media (max-width: 640px) {
            body {
                background-attachment: scroll;
            }

            .login-container {
                max-width: 430px;
                flex-wrap: wrap;
                border-radius: 22px;
            }

            .brand-side {
                flex: 0 0 100%;
                padding: 22px 20px;
            }

            .brand-side img {
                max-width: 125px;
                margin-bottom: 10px;
            }

            .brand-side h3 {
                font-size: 1.2rem;
            }

            .form-side {
                flex: 0 0 100%;
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .toast-container-custom {
                left: 15px;
                right: 15px;
                top: 15px;
            }

            .custom-toast {
                min-width: 0;
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="login-container m-3">

    <!-- BRAND SIDE -->

    <div class="brand-side">
        <img th:src="@{/images/dat-logo.png}" alt="DAT Logo">

        <h3>Contract Management</h3>

        <p>Enterprise CMS Solution</p>
    </div>

    <!-- LOGIN FORM -->

    <div class="form-side">

        <h4>Welcome Back</h4>

        <p class="text-muted mb-4">
            Please sign in to continue.
        </p>

        <!-- Login Error -->

        <div th:if="${param.error}"
             class="alert alert-danger d-flex align-items-center"
             role="alert">

            <i class="fa-solid fa-circle-exclamation me-2"></i>

            <div>Invalid Staff ID or Password.</div>
        </div>

        <!-- Logout Message -->

        <div th:if="${param.logout}"
             class="alert alert-success d-flex align-items-center"
             role="alert">

            <i class="fa-solid fa-circle-check me-2"></i>

            <div>You have been logged out successfully.</div>
        </div>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">

                <label class="form-label fw-bold">Staff ID</label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="fa-solid fa-user"></i>
                    </span>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="e.g., 25-00001"
                           required
                           autofocus>
                </div>
            </div>

            <div class="mb-3">

                <label class="form-label fw-bold">Password</label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="fa-solid fa-lock"></i>
                    </span>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter password"
                           required>
                </div>
            </div>

            <!-- Remember Me and Forgot Password -->

            <div class="d-flex justify-content-between align-items-center mb-3">

                <div class="form-check mb-0">

                    <input class="form-check-input"
                           type="checkbox"
                           id="rememberMe">

                    <label class="form-check-label" for="rememberMe">
                        Remember Me
                    </label>
                </div>

                <a href="#"
                   class="text-decoration-none"
                   data-bs-toggle="modal"
                   data-bs-target="#forgotPasswordModal">

                    Forgot Password?
                </a>
            </div>

            <button class="btn btn-primary w-100" type="submit">

                Sign In

                <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
            </button>

        </form>
    </div>
</div>


<!-- ===================== FORGOT PASSWORD MODAL ===================== -->

<div class="modal fade"
     id="forgotPasswordModal"
     tabindex="-1"
     aria-labelledby="forgotPasswordModalLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header bg-light">

                <h5 class="modal-title" id="forgotPasswordModalLabel">

                    <i class="fa-solid fa-key me-2"></i>

                    Password Reset Request
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>
            </div>

            <!-- Single Password Reset Form -->

            <form th:action="@{/forgot-password}" method="post">

                <div class="modal-body">

                    <div class="alert alert-info py-2">
                        Please enter your Staff ID and select a reason.
                    </div>

                    <!-- Staff ID -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Staff ID
                        </label>

                        <input type="text"
                               name="employeeCode"
                               class="form-control"
                               placeholder="e.g., 25-00001"
                               maxlength="20"
                               required>
                    </div>

                    <!-- Reason -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Reason for Reset
                        </label>

                        <select name="reason"
                                class="form-select"
                                required>

                            <option value="" selected disabled>
                                -- Select a reason --
                            </option>

                            <option value="forgot">
                                I forgot my password
                            </option>

                            <option value="compromised">
                                My account was compromised
                            </option>

                            <option value="expired">
                                My password expired
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>
                    </div>

                    <!-- Additional Details -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Additional Details (Optional)
                        </label>

                        <textarea name="additionalDetails"
                                  class="form-control"
                                  rows="3"
                                  maxlength="2000"
                                  placeholder="Type additional information here..."></textarea>
                    </div>

                </div>

                <!-- Modal Footer -->

                <div class="modal-footer bg-light">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Cancel
                    </button>

                    <button type="submit"
                            class="btn btn-primary">

                        Submit Request
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>


<!-- ===================== TOAST NOTIFICATIONS ===================== -->

<div class="toast-container-custom">

    <!-- Success / Email Warning Toast -->

    <div th:if="${success}"
         class="custom-toast"
         th:classappend="${#strings.contains(#strings.toLowerCase(success), 'email notification failed')} ? ' error' : ''"
         id="successToast">

        <div class="toast-icon">

            <i th:class="${#strings.contains(#strings.toLowerCase(success), 'email notification failed')}
                ? 'fa-solid fa-triangle-exclamation'
                : 'fa-solid fa-check'">
            </i>
        </div>

        <div class="toast-content">

            <div class="toast-title"
                 th:text="${#strings.contains(#strings.toLowerCase(success), 'email notification failed')}
                    ? 'Email Warning'
                    : 'Request Submitted'">
            </div>

            <p class="toast-message" th:text="${success}"></p>
        </div>

        <button type="button"
                class="toast-close"
                onclick="closeToast('successToast')">

            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- Error Toast -->

    <div th:if="${error}"
         class="custom-toast error"
         id="errorToast">

        <div class="toast-icon">
            <i class="fa-solid fa-circle-exclamation"></i>
        </div>

        <div class="toast-content">

            <div class="toast-title">Request Failed</div>

            <p class="toast-message" th:text="${error}"></p>
        </div>

        <button type="button"
                class="toast-close"
                onclick="closeToast('errorToast')">

            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

</div>


<!-- ===================== JAVASCRIPT ===================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>

    function closeToast(id) {

        const toast = document.getElementById(id);

        if (toast) {

            toast.classList.add('hide');

            setTimeout(() => {
                toast.remove();
            }, 350);
        }
    }

    document.addEventListener('DOMContentLoaded', function () {

        const toasts = document.querySelectorAll('.custom-toast');

        toasts.forEach(function (toast) {

            setTimeout(function () {
                closeToast(toast.id);
            }, 4000);

        });

    });

</script>

</body>
</html>
